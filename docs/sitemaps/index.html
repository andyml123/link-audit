:root{--bg:#f6f5f1;--card:#fff;--ink:#1d1f1c;--muted:#5f645c;--line:#e3e1d9;--accent:#2f6b4f;

*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,

.tools{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}

.tools input[type=search]{flex:1 1 220px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.card.done{opacity:.5}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{font-size:.75rem;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--accent);white-space:nowrap}
.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.bad{background:var(--bad-soft);color:var(--bad)}
.conf{font-weight:700;font-variant-numeric:tabular-nums}
.lbl{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-top:8px}
.ttl{font-weight:600;word-break:break-word}.url{font-size:.8rem;color:var(--muted);word-break:break-all}
.sent{margin:6px 0 0;padding:10px 12px;border-left:3px solid var(--accent);background:var(--bg);border-radius:0 8px 8px 0}
mark{background:var(--mark);color:var(--mark-ink);padding:0 2px;border-radius:3px}
.why{font-size:.88rem;color:var(--muted);margin-top:6px}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
button.b,a.b{font:inherit;text-decoration:none;font-size:.85rem;border:1px solid var(--line);background:var(--bg);color:var(--ink);

.num{font-variant-numeric:tabular-nums}.grid{display:grid;grid-template-columns:repeat(2,auto);justify-content:start;gap:2px 14px;font-size:.85rem;margin-top:6px;color:var(--muted)}
.grid b{color:var(--ink)}.more{display:block;margin:16px auto;font:inherit;padding:10px 18px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.empty{color:var(--muted);text-align:center;padding:30px 0}.dl a{margin-right:12px;font-size:.9rem}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);

.toast.on{opacity:1}details summary{cursor:pointer;color:var(--muted);font-size:.9rem}
ul.src{margin:6px 0 0;padding-left:18px;font-size:.9rem}ul.src li{margin:3px 0}
