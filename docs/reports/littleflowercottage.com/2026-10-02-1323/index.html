<!doctype html><html lang="en-GB"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><title>Links · littleflowercottage.com</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1d1f1c;--muted:#5f645c;--line:#e3e1d9;--accent:#2f6b4f;
--accent-ink:#fff;--soft:#e8f1ec;--warn:#9a5b13;--warn-soft:#fbf0e1;--bad:#a1332b;--bad-soft:#f9e6e4;
--mark:#ffe58a;--mark-ink:#1d1f1c}
@media (prefers-color-scheme:dark){:root{--bg:#141513;--card:#1d1f1c;--ink:#ecebe6;--muted:#a3a79f;
--line:#30332e;--accent:#7cc4a0;--accent-ink:#0f1a14;--soft:#1f2e26;--warn:#e7b169;--warn-soft:#32281b;
--bad:#ef8f86;--bad-soft:#3a2321;--mark:#6b5a12;--mark-ink:#fff6cf}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,
"Segoe UI",Roboto,sans-serif}
a{color:var(--accent)}.wrap{max-width:980px;margin:0 auto;padding:20px 16px 80px}
h1{font-size:1.45rem;margin:0 0 2px;letter-spacing:-.01em}.sub{color:var(--muted);font-size:.9rem;margin:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}
@media(min-width:700px){.stats{grid-template-columns:repeat(6,1fr)}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;line-height:1.25}
.stat b{display:block;font-size:1.35rem;font-variant-numeric:tabular-nums}.stat span{font-size:.78rem;color:var(--muted)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;position:sticky;top:0;background:var(--bg);
z-index:5;padding-top:8px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;
padding:7px 14px;font:inherit;font-size:.9rem}.tab[aria-selected=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.tools input[type=search],.tools select{font:inherit;font-size:16px;padding:8px 10px;border-radius:10px;
border:1px solid var(--line);background:var(--card);color:var(--ink);min-width:0}
.tools input[type=search]{flex:1 1 220px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.card.done{opacity:.5}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{font-size:.75rem;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--accent);white-space:nowrap}
.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.bad{background:var(--bad-soft);color:var(--bad)}
.conf{font-weight:700;font-variant-numeric:tabular-nums}
.lbl{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-top:8px}
.ttl{font-weight:600;word-break:break-word}.url{font-size:.8rem;color:var(--muted);word-break:break-all}
.sent{margin:6px 0 0;padding:10px 12px;border-left:3px solid var(--accent);background:var(--bg);border-radius:0 8px 8px 0}
mark{background:var(--mark);color:var(--mark-ink);padding:0 2px;border-radius:3px}
.why{font-size:.88rem;color:var(--muted);margin-top:6px}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
button.b,a.b{font:inherit;text-decoration:none;font-size:.85rem;border:1px solid var(--line);background:var(--bg);color:var(--ink);
border-radius:9px;padding:6px 10px}button.b.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.num{font-variant-numeric:tabular-nums}.grid{display:grid;grid-template-columns:repeat(2,auto);justify-content:start;gap:2px 14px;font-size:.85rem;margin-top:6px;color:var(--muted)}
.grid b{color:var(--ink)}.more{display:block;margin:16px auto;font:inherit;padding:10px 18px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.empty{color:var(--muted);text-align:center;padding:30px 0}.dl a{margin-right:12px;font-size:.9rem}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);
padding:8px 14px;border-radius:10px;font-size:.9rem;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}details summary{cursor:pointer;color:var(--muted);font-size:.9rem}
ul.src{margin:6px 0 0;padding-left:18px;font-size:.9rem}ul.src li{margin:3px 0}
.ex[hidden]{display:none!important}
</style></head><body><div class="wrap">
<h1>Internal links · littleflowercottage.com</h1>
<p class="sub">02 Oct 2026, 13:23 UTC · 328 pages crawled via sitemap
</p>
<div class="stats">
<div class="stat"><b>328</b><span>pages</span></div>
<div class="stat"><b>0</b><span>orphans</span></div>
<div class="stat"><b>36</b><span>nav-only</span></div>
<div class="stat"><b>141</b><span>weak (≤2 in)</span></div>
<div class="stat"><b>2418</b><span>suggestions</span></div>
<div class="stat"><b>2</b><span>bad anchors</span></div>
</div>
<div class="tabs" role="tablist">
<button class="tab" data-tab="weak" aria-selected="true">Weak pages</button>
<button class="tab" data-tab="sugg" aria-selected="false">Suggestions</button>
<button class="tab" data-tab="pages" aria-selected="false">All pages</button>
<button class="tab" data-tab="generic" aria-selected="false">Generic anchors</button>
<button class="tab" data-tab="errors" aria-selected="false">Errors (0)</button>
</div>
<div class="tools"><input type="search" id="q" placeholder="Filter by URL, title or words">
<span class="ex" data-for="sugg" style="display:contents">
<select id="minc"><option value="0">Any confidence</option><option value="50" selected>50+</option><option value="60">60+</option><option value="70">70+</option><option value="80">80+</option></select>
<select id="role"><option value="">All roles</option><option value="explains_concept">explains concept</option><option value="deeper_detail">deeper detail</option><option value="broader_guide">broader guide</option><option value="next_step">next step</option><option value="product_or_service">product or service</option><option value="comparison_or_alternative">comparison or alternative</option></select>
<label class="row" style="font-size:.9rem"><input type="checkbox" id="group"> By page</label>
<label class="row" style="font-size:.9rem"><input type="checkbox" id="hidedone"> Hide done</label></span>
<span class="ex" data-for="pages" style="display:contents" hidden><select id="ptype"></select>
<select id="psort"><option value="ctx_in">Fewest links in</option><option value="ctx_in_desc">Most links in</option><option value="words">Most words</option><option value="sugg">Most suggestions</option><option value="out">Fewest links out</option></select></span>
</div>
<div id="out"><div class="empty">Loading…</div></div>
<p class="dl sub">Download: <a href="suggestions.csv">suggestions.csv</a><a href="weak_pages.csv">weak_pages.csv</a><a href="pages.csv">pages.csv</a><a href="generic_anchors.csv">generic_anchors.csv</a><a href="report.json">report.json</a></p>
</div><div class="toast" id="toast"></div>
<script>
let D;
function init(){
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let KEY='lt-done';let done={};
function saveDone(){try{localStorage.setItem(KEY,JSON.stringify(done))}catch(e){}}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1400)}
async function copy(txt){try{await navigator.clipboard.writeText(txt);toast('Copied')}catch(e){const a=document.createElement('textarea');a.value=txt;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();toast('Copied')}}
const short=u=>{try{const x=new URL(u);return x.pathname+(x.search||'')}catch(e){return u}};
const ROLE={explains_concept:'explains concept',deeper_detail:'deeper detail',broader_guide:'broader guide',next_step:'next step',product_or_service:'product/service',comparison_or_alternative:'comparison'};
let tab='weak',shown=50;
function hl(sent,anchor){const i=sent.indexOf(anchor);if(i<0)return esc(sent);return esc(sent.slice(0,i))+'<mark>'+esc(anchor)+'</mark>'+esc(sent.slice(i+anchor.length))}
function sid(s){return s.source+'|'+s.target}
function suggCard(s){const k=sid(s);return `<div class="card ${done[k]?'done':''}" data-k="${esc(k)}">
<div class="row"><span class="conf">${s.confidence}</span><span class="chip">${ROLE[s.role]||s.role}</span>
${s.target_ctx_in===0?'<span class="chip bad">target has no contextual links</span>':''}${s.nav_link_exists?'<span class="chip warn">already linked in nav/related</span>':''}</div>
<div class="lbl">On this page</div><div class="ttl"><a href="${esc(s.source)}" target="_blank" rel="noopener">${esc(s.source_title||short(s.source))}</a></div>
${s.section?`<div class="url">Under heading: ${esc(s.section)}</div>`:''}
<div class="sent">${hl(s.sentence,s.anchor)}</div>
<div class="lbl">Link to</div><div class="ttl"><a href="${esc(s.target)}" target="_blank" rel="noopener">${esc(s.target_title||short(s.target))}</a></div><div class="url">${esc(short(s.target))}</div>
${s.alt_anchors.length?`<div class="why">Other anchors: ${s.alt_anchors.map(a=>'“'+esc(a)+'”').join(', ')}</div>`:''}
<div class="why">${esc(s.why)}</div>
<div class="btns"><button class="b pri" data-copy="${esc(s.target)}">Copy link</button><button class="b" data-copy="${esc(s.anchor)}">Copy anchor</button>
<button class="b" data-copy="${esc(s.sentence)}">Copy sentence</button><button class="b" data-done="${esc(k)}">${done[k]?'Undo done':'Mark done'}</button></div></div>`}
function agentText(src,list){return `Add these internal links to ${src}. Only change the wording if the anchor phrase isn't in the sentence exactly.\n\n`+list.map((s,i)=>`${i+1}. In the sentence: "${s.sentence}"\n   Link the words "${s.anchor}" to ${s.target}`).join('\n\n')}
function render(){const q=($('#q').value||'').toLowerCase();const out=$('#out');let html='',items=[];
const tools=$('#tools-extra');
if(tab==='sugg'){const mc=+$('#minc').value||0,role=$('#role').value,group=$('#group').checked,hide=$('#hidedone').checked;
items=D.suggestions.filter(s=>s.confidence>=mc&&(!role||s.role===role)&&(!hide||!done[sid(s)])&&(!q||(s.source+s.target+s.anchor+s.sentence+s.source_title+s.target_title).toLowerCase().includes(q)));
if(group){const g={};items.forEach(s=>(g[s.source]=g[s.source]||[]).push(s));const keys=Object.keys(g).sort((a,b)=>g[b].length-g[a].length);
html=keys.slice(0,shown).map(src=>`<div class="card"><div class="row"><span class="ttl">${esc(g[src][0].source_title||short(src))}</span><span class="chip">${g[src].length} links</span></div><div class="url">${esc(short(src))}</div>
<div class="btns"><button class="b pri" data-agent="${esc(src)}">Copy for Claude</button><a class="b" href="${esc(src)}" target="_blank" rel="noopener">Open page</a></div>
<details><summary>Show the ${g[src].length} suggestions</summary>${g[src].map(suggCard).join('')}</details></div>`).join('');items=keys}
else html=items.slice(0,shown).map(suggCard).join('')}
else if(tab==='weak'){items=D.weak.filter(w=>!q||(w.url+w.title).toLowerCase().includes(q));
html=items.slice(0,shown).map(w=>`<div class="card"><div class="row"><span class="chip ${w.status==='weak'?'warn':'bad'}">${w.status}</span><span class="chip">${esc(w.type)}</span></div>
<div class="ttl" style="margin-top:6px"><a href="${esc(w.url)}" target="_blank" rel="noopener">${esc(w.title||short(w.url))}</a></div><div class="url">${esc(short(w.url))}</div>
<div class="grid"><span>Contextual in <b>${w.ctx_in}</b></span><span>Total in <b>${w.total_in}</b></span><span>Words <b>${w.word_count}</b></span><span>Suggested <b>${w.suggested_in}</b></span></div>
${w.recommended_sources.length?`<div class="lbl">Should be linked from</div><ul class="src">${w.recommended_sources.map(r=>`<li><a href="${esc(r.source)}" target="_blank" rel="noopener">${esc(r.source_title||short(r.source))}</a> — “${esc(r.anchor)}” <span class="url">(${r.confidence})</span></li>`).join('')}</ul>`:'<div class="why">No good placement found on other pages — this page may need a new mention written into a related article.</div>'}
<div class="btns"><button class="b" data-show-target="${esc(w.url)}">See full suggestions</button></div></div>`).join('')}
else if(tab==='pages'){const ty=$('#ptype').value,sort=$('#psort').value;items=D.pages.filter(p=>(!ty||p.type===ty)&&(!q||(p.url+p.title).toLowerCase().includes(q)));
const S={ctx_in:(a,b)=>a.ctx_in-b.ctx_in,ctx_in_desc:(a,b)=>b.ctx_in-a.ctx_in,words:(a,b)=>b.word_count-a.word_count,sugg:(a,b)=>b.suggested_in-a.suggested_in,out:(a,b)=>a.ctx_out-b.ctx_out};items=items.slice().sort(S[sort]);
html=items.slice(0,shown).map(p=>`<div class="card"><div class="row"><span class="chip">${esc(p.type)}</span><span class="chip warn" style="background:var(--bg);color:var(--muted)">${esc(p.intent)}</span>${p.noindex?'<span class="chip bad">noindex</span>':''}</div>
<div class="ttl" style="margin-top:6px"><a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.title||short(p.url))}</a></div><div class="url">${esc(short(p.url))}</div>
<div class="grid"><span>Words <b>${p.word_count}</b></span><span>Ctx in <b>${p.ctx_in}</b></span><span>Total in <b>${p.total_in}</b></span><span>Ctx out <b>${p.ctx_out}</b></span><span>Sugg. in <b>${p.suggested_in}</b></span><span>Sugg. out <b>${p.suggested_out}</b></span></div></div>`).join('')}
else if(tab==='generic'){items=D.generic.filter(g=>!q||(g.source+g.anchor+g.target).toLowerCase().includes(q));
html=items.slice(0,shown).map(g=>`<div class="card"><div class="row"><span class="chip warn">${esc(g.problem)}</span></div><div class="lbl">Anchor</div><div class="ttl">“${esc(g.anchor)}”</div>
<div class="lbl">On</div><div><a href="${esc(g.source)}" target="_blank" rel="noopener">${esc(g.source_title||short(g.source))}</a></div><div class="lbl">Points to</div><div class="url">${esc(g.target)}</div></div>`).join('')}
else if(tab==='errors'){items=D.errors.filter(e=>!q||(e.url+e.error).toLowerCase().includes(q));html=items.slice(0,shown).map(e=>`<div class="card"><div class="url">${esc(e.url)}</div><div>${esc(e.error)}</div></div>`).join('')}
if(!items.length)html='<div class="empty">Nothing here.</div>';
if(items.length>shown)html+=`<button class="more" id="more">Show more (${items.length-shown} left)</button>`;
out.innerHTML=`<div class="sub" style="margin:4px 0 6px">${items.length} result${items.length===1?'':'s'}</div>`+html;
document.querySelectorAll('.ex').forEach(e=>e.hidden=e.dataset.for!==tab)}
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;
if(t.classList.contains('tab')){tab=t.dataset.tab;shown=50;document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',x===t));render();return}
if(t.id==='more'){shown+=50;render();return}
if(t.dataset.copy!==undefined){copy(t.dataset.copy);return}
if(t.dataset.done){const k=t.dataset.done;if(done[k])delete done[k];else done[k]=1;saveDone();render();return}
if(t.dataset.agent){const src=t.dataset.agent;copy(agentText(src,D.suggestions.filter(s=>s.source===src&&!done[sid(s)])));return}
if(t.dataset.showTarget){tab='sugg';shown=50;$('#q').value=t.dataset.showTarget;$('#group').checked=false;document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',x.dataset.tab==='sugg'));render();scrollTo(0,0)}});
['#q','#minc','#role','#group','#hidedone','#ptype','#psort'].forEach(s=>{const el=$(s);el&&el.addEventListener('input',()=>{shown=50;render()})});
const types=[...new Set(D.pages.map(p=>p.type))].sort();$('#ptype').innerHTML='<option value="">All types</option>'+types.map(t=>`<option>${t}</option>`).join('');
render();}
fetch('report.json').then(r=>r.json()).then(d=>{D=d;KEY='lt-done-'+D.site;try{done=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){};init()})
.catch(()=>{$('#out').innerHTML='<div class="empty">Couldn’t load report.json — open this page from your GitHub Pages site.</div>'});
</script></body></html>
