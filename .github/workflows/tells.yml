name: AI-writing tells audit

on:
  workflow_dispatch:
    inputs:
      site:
        description: "Which site?"
        type: choice
        default: littleflowercottage.com
        options:
          - littleflowercottage.com
          - sympathymessageideas.com
          - someonesentyouagreeting.com
          - weddingcardmessage.com
      skip_blockquotes:
        description: "Ignore sample messages in blockquotes"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: tells
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install requests beautifulsoup4 lxml

      - name: Audit posts
        env:
          SITE: ${{ inputs.site }}
          SKIP: ${{ inputs.skip_blockquotes }}
        run: |
          FLAG=""
          if [[ "$SKIP" == "true" ]]; then FLAG="--skip-blockquotes"; fi
          python -m tellstool.run "$SITE" $FLAG --out tells

      # Results go in tells/, outside docs/, so they are not published on GitHub Pages
      - name: Save results
        run: |
          git config user.name "link-audit-bot"
          git config user.email "link-audit-bot@users.noreply.github.com"
          git add tells
          git commit -m "Tells audit: ${{ inputs.site }}" || exit 0
          git pull --rebase
          git push
