name: Extract sitemap URLs

on:
  workflow_dispatch:
    inputs:
      address:
        description: "Website (e.g. example.com) or sitemap address (e.g. https://example.com/sitemap_index.xml)"
        required: true
        default: ""

permissions:
  contents: write

concurrency:
  group: sitemap
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install requests lxml

      - name: Find and read sitemaps
        env:
          ADDRESS: ${{ inputs.address }}
        run: python -m sitemaptool.run "$ADDRESS" --out docs

      - name: Publish result
        env:
          ADDRESS: ${{ inputs.address }}
        run: |
          git config user.name "link-audit-bot"
          git config user.email "link-audit-bot@users.noreply.github.com"
          git add docs/sitemaps
          git commit -m "Sitemap extract: $ADDRESS" || exit 0
          git pull --rebase
          git push
